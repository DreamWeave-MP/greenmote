[package]
name = "greenmote"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
clap_mangen = "0.2.29"
eframe = { version = "0.33.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[dependencies.openmw-config]
version = "1.0.3"

[dependencies.vfstool_lib]
version = "0.9.0"
features = ["beth-archives"]

[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
branch = "main"
features = ["esp"]
