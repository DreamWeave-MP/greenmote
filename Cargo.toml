[package]
name = "greenmote"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.17.2", optional = true }
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
rapier3d = { version = "0.35.2", default-features = false, features = ["dim3", "f32"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
glam = "=0.30.10"

[dependencies.openmw-config]
version = "1.1.0"

[dependencies.vfstool_lib]
version = "0.9.0"
features = ["beth-archives"]

[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
branch = "main"
features = ["esp", "nif"]
